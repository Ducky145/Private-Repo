<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mini Block City — 3D</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body{height:100%;margin:0;overflow:hidden;background:#87CEEB;font-family:Arial,Helvetica,sans-serif}
    #hud{position:absolute;left:12px;top:12px;background:rgba(255,255,255,0.9);padding:8px;border-radius:6px;z-index:5}
    #hotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;display:flex;gap:8px;z-index:5}
    .slot{width:64px;height:64px;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;border:2px solid rgba(0,0,0,0.15);cursor:pointer;font-weight:700}
    .sel{border-color:gold;box-shadow:0 0 12px rgba(255,200,0,0.5)}
    #msg{position:absolute;right:12px;top:12px;background:rgba(0,0,0,0.45);color:#fff;padding:8px;border-radius:6px;z-index:5}
    #info{font-size:13px}
    canvas{display:block}
  </style>
</head>
<body>
  <div id="hud">
    <div id="info">Click view to lock mouse. WASD + mouse to move. Space jump. Left-click break, Right-click place.</div>
  </div>
  <div id="msg">Mini Block City</div>
  <div id="hotbar"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.154.0/examples/js/controls/PointerLockControls.js"></script>

  <script>
  // ===== SETTINGS =====
  const WORLD_W = 20; // x
  const WORLD_D = 20; // z
  const WORLD_H = 10; // y
  const BLOCK = 1; // block size (1 unit)
  const SAVE_KEY = 'mini_block_city_v1';
  const HOTBAR = [1,2,3,4,5];

  const PALETTE = {
    0: {name:'Air', color:null},
    1: {name:'Asphalt', color:0x2b2b2b},
    2: {name:'Concrete', color:0x9e9e9e},
    3: {name:'Brick', color:0xb24a3a},
    4: {name:'Glass', color:0x7ed1ff, opacity:0.6},
    5: {name:'Grass', color:0x3caf2f}
  };

  // ===== THREE.js SCENE =====
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x87CEEB, 30, 120);
  const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  // lights
  const ambient = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(30,60,10);
  scene.add(sun);

  // pointer lock controls
  const controls = new THREE.PointerLockControls(camera, renderer.domElement);
  document.addEventListener('click', ()=>{ if(!controls.isLocked) controls.lock(); });
  scene.add(controls.getObject());

  // ground plane (invisible, prevents falling forever)
  const groundMat = new THREE.MeshBasicMaterial({visible:false});
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000,1000), groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -1;
  scene.add(ground);

  // ===== WORLD DATA =====
  const world = new Uint8Array(WORLD_W * WORLD_H * WORLD_D);
  function idx(x,y,z){ return y*WORLD_W*WORLD_D + z*WORLD_W + x; }

  // seeded RNG helper
  function mulberry32(a){ return function(){ var t = a += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; } }
  function hashStr(s){ let h=2166136261|0; for(let i=0;i<s.length;i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0; }

  // generate a small city
  function generateCity(seed=''+Math.floor(Math.random()*1e9)){
    const rng = mulberry32(hashStr(seed));
    world.fill(0);
    const ROAD_SP = 6;
    for(let z=0; z<WORLD_D; z++){
      for(let x=0; x<WORLD_W; x++){
        if(x % ROAD_SP === 0 || z % ROAD_SP === 0){
          world[idx(x,0,z)] = 1; // asphalt
          // sidewalks
          [[1,0],[-1,0],[0,1],[0,-1]].forEach(o=>{
            const sx = x+o[0], sz = z+o[1];
            if(sx>=0 && sx<WORLD_W && sz>=0 && sz<WORLD_D && world[idx(sx,0,sz)] === 0) world[idx(sx,0,sz)] = 2;
          });
        } else {
          if(rng() < 0.02) world[idx(x,0,z)] = 5;
        }
      }
    }
    // buildings
    for(let lotZ=0; lotZ<WORLD_D; lotZ+=ROAD_SP){
      for(let lotX=0; lotX<WORLD_W; lotX+=ROAD_SP){
        if(rng() < 0.12) continue;
        const sx = lotX + 1 + Math.floor(rng()*(ROAD_SP-3));
        const sz = lotZ + 1 + Math.floor(rng()*(ROAD_SP-3));
        const bw = 1 + Math.floor(rng()*(Math.max(1,ROAD_SP-3)));
        const bd = 1 + Math.floor(rng()*(Math.max(1,ROAD_SP-3)));
        const h = 2 + Math.floor(rng()*6);
        const t = rng() < 0.5 ? 3 : 2;
        for(let z=sz; z<sz+bd && z<WORLD_D; z++){
          for(let x=sx; x<sx+bw && x<WORLD_W; x++){
            for(let y=1; y<=h && y<WORLD_H; y++){
              // occasional glass row
              if(y === Math.floor(h/2) && rng() < 0.25) world[idx(x,y,z)] = 4;
              else world[idx(x,y,z)] = t;
            }
          }
        }
      }
    }
  }

  // ===== MESHES =====
  const blockMeshes = []; // store each block mesh for raycast/interactions (small world)
  const cubeGeo = new THREE.BoxGeometry(BLOCK, BLOCK, BLOCK);

  function rebuildScene(){
    // remove previous meshes
    for(const m of blockMeshes) {
      scene.remove(m);
      if(m.geometry) m.geometry.dispose();
      if(m.material) m.material.dispose();
    }
    blockMeshes.length = 0;
    // create meshes for non-air blocks
    for(let y=0;y<WORLD_H;y++){
      for(let z=0;z<WORLD_D;z++){
        for(let x=0;x<WORLD_W;x++){
          const b = world[idx(x,y,z)];
          if(b === 0) continue;
          const info = PALETTE[b];
          const matOpt = {color: info.color || 0xffffff};
          if(info.opacity){ matOpt.transparent = true; matOpt.opacity = info.opacity; }
          const mat = new THREE.MeshStandardMaterial(matOpt);
          const m = new THREE.Mesh(cubeGeo, mat);
          m.position.set(x*BLOCK + BLOCK/2, y*BLOCK + BLOCK/2, z*BLOCK + BLOCK/2);
          m.userData = {x,y,z,type:b};
          scene.add(m);
          blockMeshes.push(m);
        }
      }
    }
  }

  // ===== PLAYER =====
  const player = {velY:0, onGround:false, height:1.7, speed:6};
  controls.getObject().position.set(WORLD_W/2, 6, WORLD_D+6);

  // simple ground detection (checks block under feet)
  function groundUnder(pos){
    const px = Math.floor(pos.x / BLOCK);
    const pz = Math.floor(pos.z / BLOCK);
    for(let y = Math.floor((pos.y - player.height/2)/BLOCK); y >= 0; y--){
      if(px>=0 && px<WORLD_W && pz>=0 && pz<WORLD_D){
        if(world[idx(px,y,pz)] !== 0) return y;
      }
    }
    return -1;
  }

  // ===== RAYCAST / INTERACTION =====
  const ray = new THREE.Raycaster();
  function getLookRay(){
    const origin = camera.getWorldPosition(new THREE.Vector3());
    const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
    ray.set(origin, dir);
    return ray;
  }
  function pickBlock(){
    const r = getLookRay();
    const hits = r.intersectObjects(blockMeshes, false);
    if(hits.length) return hits[0];
    return null;
  }
  function breakBlock(){
    const hit = pickBlock(); if(!hit) return;
    const {x,y,z} = hit.object.userData;
    world[idx(x,y,z)] = 0;
    rebuildScene();
    saveWorld();
  }
  function placeBlock(selectedType){
    const hit = pickBlock(); if(!hit) return;
    // determine face normal
    const faceIndex = hit.faceIndex;
    const triFace = Math.floor(faceIndex / 2) % 6;
    const normals = [ new THREE.Vector3(1,0,0), new THREE.Vector3(-1,0,0),
                      new THREE.Vector3(0,1,0), new THREE.Vector3(0,-1,0),
                      new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,-1) ];
    const n = normals[triFace];
    let tx = hit.object.userData.x + n.x;
    let ty = hit.object.userData.y + n.y;
    let tz = hit.object.userData.z + n.z;
    if(tx<0||tx>=WORLD_W||ty<0||ty>=WORLD_H||tz<0||tz>=WORLD_D) return;
    if(world[idx(tx,ty,tz)] !== 0) return;
    world[idx(tx,ty,tz)] = selectedType;
    rebuildScene();
    saveWorld();
  }

  // prevent context menu on right click
  window.addEventListener('contextmenu', e=>e.preventDefault());

  renderer.domElement.addEventListener('pointerdown', (e)=>{
    if(!controls.isLocked) return;
    if(e.button === 0) breakBlock();
    else if(e.button === 2) placeBlock(HOTBAR[selectedHotbar]);
  });

  // ===== HOTBAR UI =====
  const hotbarEl = document.getElementById('hotbar');
  let selectedHotbar = 0;
  function buildHotbar(){
    hotbarEl.innerHTML = '';
    for(let i=0;i<HOTBAR.length;i++){
      const id = HOTBAR[i];
      const info = PALETTE[id];
      const d = document.createElement('div');
      d.className = 'slot' + (i===selectedHotbar ? ' sel' : '');
      d.innerHTML = `<div style="text-align:center">${i+1}<br>${info.name}</div>`;
      d.onclick = ()=>{ selectedHotbar = i; updateHotbar(); };
      hotbarEl.appendChild(d);
    }
  }
  function updateHotbar(){
    Array.from(hotbarEl.children).forEach((c,idx)=> c.className = 'slot' + (idx===selectedHotbar ? ' sel' : ''));
  }
  buildHotbar();
  window.addEventListener('keydown', e=>{
    if(e.code.startsWith('Digit')){
      const n = parseInt(e.code.slice(5));
      if(!isNaN(n) && n>=1 && n<=HOTBAR.length){ selectedHotbar = n-1; updateHotbar(); }
    }
  });

  // ===== SAVE / LOAD =====
  function saveWorld(){
    const data = {w:WORLD_W,h:WORLD_H,d:WORLD_D,world:Array.from(world)};
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  }
  function loadWorld(){
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    try{
      const d = JSON.parse(raw);
      if(d && d.world && d.world.length === WORLD_W*WORLD_H*WORLD_D){
        for(let i=0;i<world.length;i++) world[i] = d.world[i];
        return true;
      }
    }catch(e){}
    return false;
  }

  // ===== GENERATE / INIT =====
  generateCity();
  if(!loadWorld()) { /* using freshly generated world */ }
  rebuildScene();

  // ===== MOVEMENT / PHYSICS =====
  const keys = {};
  window.addEventListener('keydown', e=> keys[e.code]=true);
  window.addEventListener('keyup', e=> keys[e.code]=false);

  let last = performance.now();
  function animate(){
    const now = performance.now();
    const dt = Math.min(0.05,(now-last)/1000);
    last = now;

    // movement (WASD)
    const forward = (keys['KeyW']?1:0) - (keys['KeyS']?1:0);
    const strafe  = (keys['KeyD']?1:0) - (keys['KeyA']?1:0);
    if(forward || strafe){
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
      const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();
      const move = new THREE.Vector3();
      move.add(dir.multiplyScalar(forward));
      move.add(right.multiplyScalar(strafe));
      if(move.lengthSq()>0){ move.normalize().multiplyScalar(player.speed * dt); controls.getObject().position.add(move); }
    }

    // gravity and ground
    player.velY -= 9.8 * dt;
    controls.getObject().position.y += player.velY * dt;
    const g = groundUnder(controls.getObject().position);
    if(g >= 0){
      const targetY = (g+1)*BLOCK + player.height/2;
      if(controls.getObject().position.y <= targetY + 0.05){
        controls.getObject().position.y = targetY;
        player.velY = 0;
        player.onGround = true;
      } else {
        player.onGround = false;
      }
    } else {
      player.onGround = false;
      if(controls.getObject().position.y < -20){
        controls.getObject().position.set(WORLD_W/2, 6, WORLD_D+6);
        player.velY = 0;
      }
    }
    // jump
    if(keys['Space'] && player.onGround){ player.velY = 6; player.onGround = false; }

    // subtle day/night sky change
    const t = (now*0.00004) % 1;
    const day = new THREE.Color(0x87CEEB);
    const night = new THREE.Color(0x071029);
    scene.background = day.clone().lerp(night, 1 - Math.abs(Math.sin(t*Math.PI*2))*0.7);
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();

  // ===== UTIL / UI HELPERS =====
  // simple UI text update
  const msg = document.getElementById('msg');
  function setMsg(s){
    msg.textContent = s;
    setTimeout(()=>{ msg.textContent = 'Mini Block City'; }, 2500);
  }

  // expose save on blur
  window.addEventListener('beforeunload', ()=> saveWorld());

  // small help when pointer lock lost/gained
  controls.addEventListener('lock', ()=> setMsg('Controls locked — play!'));
  controls.addEventListener('unlock', ()=> setMsg('Pointer unlocked — click to lock again'));

  // done
  setMsg('World ready — click to lock and play');

  </script>
</body>
</html>
